[project]
name = "mobile-bimanual-ros2-teleop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuanshao Yang", email = "yyang3051@gatech.edu" }
]
requires-python = "==3.10.*"
dependencies = [
    "mink==1.3.0",
    "mujoco==3.12.0",
    "numpy<2",
    "scipy>=1.15.3",
    # SEW-Geometric-Teleop (References/): self-collision filter and XR client.
    # Match Ubuntu 22.04's python3-matplotlib: its mpl_toolkits is a regular
    # package, so it shadows the venv's copy and must match this version.
    "matplotlib==3.5.1",
    "termcolor",
    "xr-robot-teleop-server",
    # Pulled in by xr-robot-teleop-server's video transforms; SEW doesn't use
    # them, so take the CPU build instead of the multi-GB CUDA one.
    "torch",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
